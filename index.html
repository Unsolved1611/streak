<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0b10" />
    <meta name="description" content="A private, offline-first focus streak tracker with a visual evolution system. Your data stays on your device." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />

    <!-- PWA / mobile home screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vault" />
    <meta name="application-name" content="Vault" />
    <meta name="format-detection" content="telephone=no" />

    <title>Vault</title>
    <style>
      html,
      body {
        margin: 0;
        background: #07080c;
        color: #e7e9f0;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #07080c;
        font-family: ui-sans-serif, system-ui, sans-serif;
        transition: opacity 0.4s ease;
      }
      #boot span {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: rgba(255, 255, 255, 0.7);
        animation: bootspin 0.9s linear infinite;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true"><span></span></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
